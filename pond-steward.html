<title>Pond Steward</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: field-guide game board. Live pond scene + four meters on one side, a decision panel on the other; stacks on phones. */
:root {
  --bg: #eef2ec; --surface: #ffffff; --surface-2: #f6f8f4; --ink: #15221d; --muted: #586a62; --line: #d5ddd6;
  --accent: #6a4c9c; --accent-ink: #ffffff; --accent-soft: #ece6f6;
  --good: #2c7a4b; --warn: #a86b12; --bad: #b0373a;
  --grass: #c2d5a2; --grass-2: #b0c78e; --tallgrass: #7e9a4f; --marsh: #4d7a38; --flower: #7a58c6;
  --water-clear: #3d8ea8; --water-algae: #6f9c2e; --water-murky: #8c7a4a;
  --street: #cdcac1; --roof: #8b5944; --house: #f2ece2; --sand: #d6bd86; --pipe: #7d837f;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101613; --surface: #18201c; --surface-2: #1d2621; --ink: #e5ece7; --muted: #9caba3; --line: #2c3833;
  --accent: #ab90e4; --accent-ink: #16101f; --accent-soft: #2a2238;
  --good: #5cc088; --warn: #e3ab4d; --bad: #ec7b7b;
  --grass: #2d4127; --grass-2: #273922; --tallgrass: #5f7d3c; --marsh: #74a052; --flower: #b89cf2;
  --water-clear: #2b7a91; --water-algae: #5c8826; --water-murky: #6c6040;
  --street: #3a3e3b; --roof: #7b4a37; --house: #4d4842; --sand: #8b774b; --pipe: #8d938f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101613; --surface: #18201c; --surface-2: #1d2621; --ink: #e5ece7; --muted: #9caba3; --line: #2c3833;
  --accent: #ab90e4; --accent-ink: #16101f; --accent-soft: #2a2238;
  --good: #5cc088; --warn: #e3ab4d; --bad: #ec7b7b;
  --grass: #2d4127; --grass-2: #273922; --tallgrass: #5f7d3c; --marsh: #74a052; --flower: #b89cf2;
  --water-clear: #2b7a91; --water-algae: #5c8826; --water-murky: #6c6040;
  --street: #3a3e3b; --roof: #7b4a37; --house: #4d4842; --sand: #8b774b; --pipe: #8d938f;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.02em; margin: 0; line-height: 1; }
.lvl { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px; }
.when { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); display: block; }
.dots i.wet { background: color-mix(in srgb, var(--water-clear) 45%, var(--line)); }
.dots i.done { background: var(--muted); }
.dots i.now { background: var(--accent); }

.board { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .board { grid-template-columns: minmax(0, 1fr); } }

.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.scene svg { display: block; width: 100%; height: auto; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
@media (max-width: 460px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { background: var(--surface); padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; }
.meter .lab { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.meter .val { font-family: var(--f-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .val small { font-family: var(--f-body); font-size: 0.75rem; color: var(--muted); margin-left: 4px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar span { display: block; height: 100%; background: var(--good); transition: width .6s ease, background .3s; }
.bar span.mid { background: var(--warn); } .bar span.low { background: var(--bad); }
.delta { font-family: var(--f-mono); font-size: 0.75rem; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.01em; margin: 0; line-height: 1.15; text-wrap: balance; }
.panel p { margin: 0; max-width: 62ch; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.goals { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.goals li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.goals svg { width: 28px; height: 28px; }

.group { display: grid; gap: 8px; }
.group > .gh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.group > .gh b { font-size: 0.95rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.opt { text-align: left; font: inherit; color: inherit; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .n { font-weight: 700; font-size: 0.93rem; line-height: 1.25; }
.opt .c { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt .d { font-size: 0.8rem; color: var(--muted); line-height: 1.35; }
.opt[disabled] { opacity: 0.45; cursor: not-allowed; }
.opt .tag { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }

.budget { display: grid; gap: 6px; padding: 12px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.budget .row { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.budget .bar { height: 8px; }
.over { color: var(--bad); font-weight: 700; }

.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 12px 18px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.85rem; color: var(--muted); }

.forecast { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.forecast.alert { border-color: var(--warn); }
.forecast .ic { width: 34px; height: 34px; }
.forecast b { display: block; }
.forecast span { font-size: 0.88rem; color: var(--muted); }

.events { display: grid; gap: 8px; }
.event { padding: 10px 12px 10px 14px; border-radius: 8px; background: var(--surface-2); border-left: 4px solid var(--warn); font-size: 0.92rem; }
.event.bad { border-left-color: var(--bad); }
.event.ok { border-left-color: var(--good); }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.why li { padding-left: 18px; position: relative; font-size: 0.95rem; max-width: 62ch; }
.why li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.whybox { border: 1px dashed var(--accent); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.whybox h3 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; }
.rain { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.scores { display: grid; gap: 10px; }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.score .s-l b { display: block; }
.score .s-l span { font-size: 0.84rem; color: var(--muted); }
.stars { display: flex; gap: 2px; }
.stars svg { width: 22px; height: 22px; }
.pass { font-family: var(--f-mono); font-size: 0.8rem; font-weight: 500; padding: 3px 10px; border-radius: 999px; }
.pass.y { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pass.n { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.unlock { border-radius: 12px; padding: 16px; display: grid; gap: 8px; border: 2px solid var(--accent); background: var(--accent-soft); }
.unlock.locked { border-style: dashed; background: transparent; border-color: var(--line); }
.unlock h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
.unlock ul { margin: 0; padding-left: 18px; font-size: 0.92rem; }
.spark { width: 100%; height: auto; display: block; }
.code { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
.code input { font-family: var(--f-mono); font-size: 0.95rem; width: 7.5em; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.code b { font-family: var(--f-mono); color: var(--ink); }

/* scene animation */
#rain line { stroke: var(--water-clear); stroke-width: 1.4; stroke-linecap: round; opacity: 0; }
.raining #rain line { animation: fall .7s linear infinite; }
@keyframes fall { 0% { transform: translate(0, -30px); opacity: 0; } 20% { opacity: .75; } 100% { transform: translate(-8px, 40px); opacity: 0; } }
#water { transition: fill 1.2s ease; }
#swell { transition: transform 1s ease; transform-origin: 200px 150px; }
.raining #swell { transform: scale(1.06); }
.ring { fill: none; stroke: #ffffff; stroke-width: 1.2; opacity: 0; transform-origin: center; transform-box: fill-box; animation: ring 2.4s ease-out infinite; }
.ring.r2 { animation-delay: 1.2s; }
@keyframes ring { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(2.2); opacity: 0; } }
.fish { transition: opacity .8s; animation: drift 7s ease-in-out infinite alternate; transform-box: fill-box; }
@keyframes drift { from { transform: translateX(-6px); } to { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .raining #rain line, .ring, .fish { animation: none; } #rain line { opacity: .5; } #swell, #water { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Pond Steward</h1><span class="lvl" id="lvl">Level 1 · Heron Lake HOA</span></div>
    <div class="when" id="when"></div>
  </header>

  <div class="board">
    <section class="scene" aria-label="Your pond">
      <svg id="scene" viewBox="0 0 400 300" role="img" aria-label="Top-down view of the neighborhood pond">
        <defs>
          <clipPath id="pondClip"><path id="pondClipPath"/></clipPath>
        </defs>
        <rect width="400" height="300" fill="var(--grass)"/>
        <path d="M0 0H400V40C320 54 240 30 160 46S40 40 0 52Z" fill="var(--grass-2)" opacity=".7"/>
        <!-- street -->
        <rect x="0" y="270" width="400" height="30" fill="var(--street)"/>
        <line x1="0" y1="285" x2="400" y2="285" stroke="var(--grass)" stroke-width="1.5" stroke-dasharray="10 10" opacity=".7"/>
        <!-- houses -->
        <g id="houses"></g>
        <!-- inlet pipe -->
        <path d="M30 262 C 60 230, 70 200, 96 178" fill="none" stroke="var(--pipe)" stroke-width="5" stroke-linecap="round"/>
        <rect id="trap" x="80" y="166" width="26" height="20" rx="3" fill="var(--sand)" stroke="var(--pipe)" stroke-width="1.5"/>
        <!-- outlet -->
        <path d="M316 150 H 392" stroke="var(--pipe)" stroke-width="5" stroke-linecap="round"/>
        <rect id="outlet" x="306" y="140" width="18" height="20" rx="3" fill="var(--surface)" stroke="var(--pipe)" stroke-width="1.5"/>
        <g id="swell">
          <path id="buffer" fill="none" stroke="var(--tallgrass)" stroke-linejoin="round" stroke-dasharray="1.5 2.5" opacity="0"/>
          <path id="shelf" fill="none" stroke="var(--marsh)" stroke-linejoin="round"/>
          <path id="water" fill="var(--water-clear)"/>
          <g clip-path="url(#pondClip)">
            <ellipse id="deep" cx="205" cy="150" rx="70" ry="38" fill="#000" opacity=".10"/>
            <ellipse id="silt" cx="118" cy="168" rx="60" ry="34" fill="var(--sand)" opacity="0"/>
            <g id="algae"></g>
            <g id="fishes"></g>
          </g>
          <g id="weeds"></g>
          <g id="flowers"></g>
          <g id="fountain" opacity="0">
            <circle class="ring" cx="205" cy="150" r="10"/>
            <circle class="ring r2" cx="205" cy="150" r="10"/>
            <circle cx="205" cy="150" r="4" fill="#ffffff" opacity=".9"/>
          </g>
        </g>
        <g id="rain"></g>
        <text x="390" y="141" text-anchor="end" font-size="9" fill="var(--ink)" opacity=".7" font-family="var(--f-mono)">outlet</text>
        <text x="40" y="232" font-size="9" fill="var(--ink)" opacity=".7" font-family="var(--f-mono)">inlet</text>

    </section>

    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

<script>
// ===== Pond engine: pure, seeded, no DOM =====
const POND = (() => {
  const DESIGN = {
    size: [
      { id: 0, name: 'Small', cost: 18000, vol: 0.6, note: 'Cheapest. Water passes through fast.' },
      { id: 1, name: 'Standard', cost: 28000, vol: 0.8, note: 'Meets the typical permit size.' },
      { id: 2, name: 'Large', cost: 40000, vol: 1.0, note: 'Holds more storm water and settles more.' }
    ],
    plants: [
      { id: 0, name: 'No edge plants', cost: 0, p: 0, note: 'Grass down to the water.' },
      { id: 1, name: 'Narrow plant shelf', cost: 5000, p: 0.5, note: 'A strip of native plants.' },
      { id: 2, name: 'Wide plant shelf', cost: 10000, p: 1.0, note: 'Pickerelweed, rushes, cordgrass.' }
    ],
    trap: [
      { id: 0, name: 'No sediment trap', cost: 0, note: 'Sand and silt go straight in.' },
      { id: 1, name: 'Sediment trap', cost: 8000, note: 'Catches sand at the inlet. Needs cleaning.' }
    ],
    fountain: [
      { id: 0, name: 'No fountain', cost: 0, note: 'Quiet water.' },
      { id: 1, name: 'Fountain', cost: 6000, note: 'Adds oxygen. $500 a season to run.' }
    ]
  };
  const BUDGET = 50000, DUES = 1500, FOUNTAIN_POWER = 500, SEASONS = 10;

  const ACTIONS = [
    { id: 'buffer', name: 'Leave a no-mow strip', cost: 0, tag: 'Edge', text: 'Let grass grow tall along the water.' },
    { id: 'mow', name: 'Mow to the water', cost: 400, tag: 'Edge', text: 'Neat and tidy, right to the edge.' },
    { id: 'flyer', name: 'Fertilizer flyer', cost: 400, tag: 'Neighbors', text: 'Ask neighbors to skip summer fertilizer.' },
    { id: 'outlet', name: 'Clear the outlet', cost: 600, tag: 'Upkeep', text: 'Pull debris from the overflow pipe.' },
    { id: 'trapclean', name: 'Empty the sediment trap', cost: 1200, tag: 'Upkeep', text: 'Dig out the sand it caught.', needs: 'trap' },
    { id: 'harvest', name: 'Pull weeds and algae', cost: 1800, tag: 'Water', text: 'Rake out mats and weeds by hand.' },
    { id: 'algaecide', name: 'Spray algaecide', cost: 1500, tag: 'Water', text: 'Clears green water fast.' }
  ];

  function rngFrom(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Weather schedule for the whole game, fixed by seed (same seed = same weather for a workshop)
  function makeWeather(seed) {
    const r = rngFrom(seed * 7 + 3);
    const list = [];
    const bigYear = 1 + Math.floor(r() * 4); // a hurricane in year 2-5
    let tsYear = Math.floor(r() * 5); if (tsYear === bigYear) tsYear = (tsYear + 2) % 5;
    const droughtYear = r() < 0.6 ? Math.floor(r() * 5) : -1;
    for (let y = 0; y < 5; y++) {
      // wet season Jun-Oct
      const heat = r() < 0.45;
      let w = { season: 'wet', year: y + 1, kind: 'typical', rain: Math.round(26 + r() * 8), mult: 1.0, storm: false, big: false, heat };
      if (y === bigYear) w = { ...w, kind: 'hurricane', rain: w.rain + 14, mult: 1.6, storm: true, big: true };
      else if (y === tsYear) w = { ...w, kind: 'tropical', rain: w.rain + 8, mult: 1.3, storm: true };
      list.push(w);
      // dry season Nov-May
      let d = { season: 'dry', year: y + 1, kind: 'typical', rain: Math.round(10 + r() * 6), mult: 0.45, storm: false, big: false, heat: false };
      if (y === droughtYear) d = { ...d, kind: 'drought', rain: Math.round(4 + r() * 2), mult: 0.2, drought: true };
      list.push(d);
    }
    // surprises
    for (const w of list) {
      const s = r();
      w.surprise = s < 0.14 ? 'clippings' : s < 0.26 ? 'construction' : null;
      w.roll = r();
    }
    return list;
  }

  function newGame(design, seed) {
    const cost = designCost(design);
    return {
      seed, design, season: 0,
      weather: makeWeather(seed),
      cash: BUDGET - cost,
      N: 28, A: 22, fish: 70, weeds: 10, sed: 0, clog: 0.1, outreach: 0, trapFill: 0,
      plants: DESIGN.plants[design.plants].p,
      mood: 70, flooded: 0, assessments: 0, fishKills: 0,
      history: []
    };
  }
  function designCost(d) {
    return DESIGN.size[d.size].cost + DESIGN.plants[d.plants].cost + DESIGN.trap[d.trap].cost + DESIGN.fountain[d.fountain].cost;
  }

  // Run one season. Returns a new state and a report. picks = array of action ids (max 2).
  function runSeason(prev, picks) {
    const s = JSON.parse(JSON.stringify(prev));
    const w = s.weather[s.season];
    const d = s.design;
    const has = id => picks.includes(id);
    const wet = w.season === 'wet';
    const vol = DESIGN.size[d.size].vol;
    const fountain = d.fountain === 1;
    const before = { A: s.A, N: s.N, fish: s.fish, mood: s.mood, cash: s.cash, clog: s.clog };
    const why = [];
    const events = [];
    let spend = 0;

    for (const id of picks) spend += ACTIONS.find(a => a.id === id).cost;
    if (fountain) spend += FOUNTAIN_POWER;

    // Actions that happen at the start of the season
    if (has('flyer')) s.outreach = clamp(s.outreach + 0.25, 0, 1);
    if (has('outlet')) s.clog = 0;
    if (has('trapclean')) s.trapFill = 0;
    if (has('harvest')) { s.weeds = clamp(s.weeds - 25, 0, 100); s.N = clamp(s.N - 6, 0, 100); s.A = clamp(s.A - 10, 0, 100); }

    let edge = 1, looksEdge = 0;
    if (has('mow')) { edge = 1.2; looksEdge = 10; s.plants = clamp(s.plants - 0.12, 0, 1); }
    else if (has('buffer')) { edge = 0.82; looksEdge = -5; s.plants = clamp(s.plants + 0.04, 0, DESIGN.plants[d.plants].p + 0.1); }

    // Watershed load
    let load = 40 * w.mult * (1 - 0.4 * s.outreach) * edge;
    if (w.surprise === 'clippings') { load += has('buffer') ? 3 : 9; events.push({ k: 'clippings', t: has('buffer') ? 'A neighbor blew grass clippings toward the pond. Your no-mow strip caught most of them.' : 'A neighbor blew grass clippings into the pond. They rot and feed algae.' }); }
    let sedIn = 0.04 * w.mult;
    if (w.surprise === 'construction') { load += 6; sedIn += 0.12; events.push({ k: 'construction', t: 'A new house went up next door. Muddy runoff washed toward the pond.' }); }

    // Sediment trap
    if (d.trap === 1) {
      const working = s.trapFill < 0.6;
      const eff = working ? 0.25 : 0.05;
      load *= (1 - eff);
      sedIn *= working ? 0.3 : 0.9;
      s.trapFill = clamp(s.trapFill + 0.12 * w.mult + (w.surprise === 'construction' ? 0.2 : 0), 0, 1);
    }
    s.sed = clamp(s.sed + sedIn, 0, 1);

    // Treatment
    const effVol = vol * (1 - 0.5 * s.sed);
    const removal = clamp(0.25 + 0.4 * effVol + 0.25 * s.plants, 0, 0.88);
    let internal = 0;
    if (wet && s.A > 60 && !fountain) internal += 6;
    if (w.drought) internal += 6;
    const exported = load * (1 - removal);
    s.N = clamp(s.N * 0.5 + exported + internal, 0, 100);

    // Algae
    let target = s.N * 2.0 * (wet ? 1 : 0.6) * (w.heat ? 1.25 : 1) * (w.drought ? 1.3 : 1) - s.plants * 15 - (fountain ? 10 : 0);
    s.A = clamp(0.5 * s.A + 0.5 * target, 0, 100);
    if (has('algaecide')) {
      s.A = clamp(s.A * 0.35, 0, 100);
      s.N = clamp(s.N + 8, 0, 100);
    }

    // Weeds
    s.weeds = clamp(s.weeds + (s.N > 30 ? 8 : 3) - s.plants * 3, 0, 100);

    // Oxygen and fish
    let kill = false;
    if (wet && !fountain && (s.A > 62 || (w.heat && s.A > 48))) kill = true;
    if (has('algaecide') && wet && w.heat && before.A > 45 && !fountain && w.roll < 0.6) kill = true;
    if (kill) {
      s.fish = clamp(s.fish - 30, 0, 100); s.fishKills++; spend += 1500;
      events.push({ k: 'fishkill', t: 'Fish kill. Dead fish floated up overnight. Cleanup cost $1,500.' });
    } else {
      s.fish = clamp(s.fish + (s.A < 40 ? 6 : 0) - (s.A > 55 ? 6 : 0), 0, 100);
    }

    // Flooding
    const clogNow = has('outlet') ? 0 : prev.clog;
    s.clog = clamp(s.clog + 0.12 * w.mult + (w.storm ? 0.15 : 0), 0, 1);
    const capacity = vol * 100 + 15 - 30 * clogNow - 20 * s.sed;
    const stormDepth = w.big ? 88 : w.storm ? 68 : wet ? 40 : 15;
    let homes = 0;
    if (stormDepth > capacity) {
      homes = Math.max(1, Math.round((stormDepth - capacity) / 4));
      s.flooded += homes; spend += homes * 3000;
      events.push({ k: 'flood', t: `The pond overflowed. Water reached ${homes} ${homes === 1 ? 'yard and garage' : 'yards and garages'}. Repairs cost $${(homes * 3000).toLocaleString('en-US')}.` });
    }

    // Money
    s.cash = s.cash + DUES - spend;
    let assessment = false;
    if (s.cash < 0) { assessment = true; s.assessments++; events.push({ k: 'assessment', t: 'The pond fund ran dry. The board had to bill every homeowner a special assessment.' }); }

    // Looks and neighbors
    const looks = clamp(0.45 * (100 - s.A) + 0.25 * s.fish + 28 + looksEdge + (fountain ? 8 : 0) - s.weeds * 0.3, 0, 100);
    s.mood = clamp(0.5 * s.mood + 0.5 * looks - homes * 8 - (assessment ? 15 : 0) - (kill ? 10 : 0), 0, 100);

    // Why did that happen?
    const dA = s.A - before.A;
    if (has('algaecide')) why.push('The algaecide cleared the water fast, but dead algae released their nutrients back into the pond. They will feed the next bloom.');
    else if (dA > 10) why.push(`Algae grew because the water carried a lot of nutrients${w.heat ? ' and the summer was hot' : ''}. Most come from lawn fertilizer and grass clippings.`);
    else if (dA < -8) why.push('The water cleared up. Fewer nutrients reached the pond, so algae had less to feed on.');
    if (has('buffer')) why.push('The tall grass strip slowed runoff and caught fertilizer before it reached the water.');
    if (has('mow')) why.push('Mowing to the edge looked neat, but nothing stopped fertilizer and clippings from washing straight in.');
    if (has('flyer') && s.outreach >= 0.5) why.push('More neighbors are skipping summer fertilizer. That keeps paying off every season.');
    if (homes > 0) why.push(clogNow > 0.35 ? `The outlet pipe was about ${Math.round(prev.clog * 100)}% clogged with debris, so water backed up instead of draining.` : 'The storm brought more water than the pond could hold.');
    else if (w.storm) why.push(`The pond held ${w.rain} inches of rain without flooding anyone.`);
    if (kill) why.push(fountain ? 'Algae used up the oxygen overnight.' : 'Warm water holds little oxygen, and decaying algae used up the rest overnight. A fountain or fewer nutrients would help.');
    if (d.trap === 1 && s.trapFill >= 0.6) why.push('The sediment trap is full. Sand and silt are now filling the pond itself.');
    if (s.sed > 0.3) why.push(`Silt has filled about ${Math.round(s.sed * 100)}% of the pond's depth, so it holds and cleans less water.`);
    if (w.drought) why.push('Drought dropped the water level. The same nutrients in less water made the pond greener.');
    if (s.weeds > 45) why.push('Nuisance weeds are spreading along the shore.');

    const report = { w, picks, spend, before, after: { A: s.A, N: s.N, fish: s.fish, mood: s.mood, cash: s.cash }, events, why: why.slice(0, 4), homes, kill, removal, exported, looks };
    s.history.push({ A: s.A, N: s.N, mood: s.mood, cash: s.cash, exported, removal, rain: w.rain, homes, looks });
    s.season++;
    return { state: s, report };
  }

  function score(s) {
    const h = s.history;
    const avg = k => h.reduce((t, x) => t + x[k], 0) / h.length;
    const avgA = avg('A'), avgExp = avg('exported'), avgMood = avg('mood'), avgN = avg('N');
    const wq = avgA < 30 && avgN < 22 ? 3 : avgA < 45 && avgN < 30 ? 2 : 1;
    const looks = avgMood >= 68 ? 3 : avgMood >= 55 ? 2 : 1;
    const cost = s.assessments > 0 ? 0 : s.cash >= 20000 ? 3 : s.cash >= 9000 ? 2 : 1;
    const flood = s.flooded === 0;
    const unlocked = flood && wq >= 2 && looks >= 2 && cost >= 2;
    return { wq, looks, cost, flood, unlocked, avgA, avgExp, avgMood, avgN };
  }

  return { DESIGN, ACTIONS, BUDGET, DUES, SEASONS, newGame, runSeason, score, designCost };
})();
if (typeof module !== 'undefined') module.exports = POND;

</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const app = {
  phase: 'intro',
  seed: 1000 + Math.floor(Math.random() * 9000),
  design: { size: 1, plants: 1, trap: 0, fountain: 0 },
  state: null, picks: [], report: null, flooded: new Set(), lastEdge: null
};

/* ---------- scene geometry ---------- */
const BLOB = 'M118 112 C 140 80, 210 78, 252 92 C 296 106, 312 128, 306 156 C 300 190, 262 210, 214 212 C 160 214, 112 204, 98 178 C 86 156, 100 128, 118 112 Z';
const HOUSES = [[36, 70], [96, 52], [156, 46], [252, 46], [312, 54], [356, 96], [356, 206], [300, 236], [138, 238]];
function seeded(n) { let a = n; return () => { a = (a * 9301 + 49297) % 233280; return a / 233280; }; }
function buildStatic() {
  const h = $('#houses');
  HOUSES.forEach(([x, y], i) => {
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<rect x="${x - 14}" y="${y - 10}" width="28" height="22" rx="2" fill="var(--house)" stroke="var(--line)"/><path d="M${x - 17} ${y - 8} L${x} ${y - 21} L${x + 17} ${y - 8} Z" fill="var(--roof)"/><ellipse class="puddle" cx="${x}" cy="${y + 17}" rx="20" ry="6" fill="var(--water-clear)" opacity="0"/>`;
    g.dataset.i = i; h.appendChild(g);
  });
  const r = seeded(7), al = $('#algae');
  for (let i = 0; i < 26; i++) {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', 120 + r() * 180); e.setAttribute('cy', 100 + r() * 105);
    e.setAttribute('rx', 6 + r() * 14); e.setAttribute('ry', 3 + r() * 6);
    e.setAttribute('fill', 'var(--water-algae)'); e.dataset.t = (i / 26).toFixed(3);
    al.appendChild(e);
  }
  const rain = $('#rain');
  for (let i = 0; i < 70; i++) {
    const l = document.createElementNS(NS, 'line');
    const x = r() * 420, y = r() * 260;
    l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x - 4); l.setAttribute('y2', y + 12);
    l.style.animationDelay = (r() * 0.7).toFixed(2) + 's'; l.dataset.t = (i / 70).toFixed(3);
    rain.appendChild(l);
  }
  ['#water', '#shelf', '#buffer', '#pondClipPath'].forEach(s => $(s).setAttribute('d', BLOB));
}
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function drawScene() {
  const d = app.design, s = app.state;
  const A = s ? s.A : 22, fish = s ? s.fish : 70, weeds = s ? s.weeds : 10, sed = s ? s.sed : 0, clog = s ? s.clog : 0.1;
  const plants = s ? s.plants : POND.DESIGN.plants[d.plants].p;
  const k = [0.82, 0.92, 1.0][d.size];
  $('#swell').setAttribute('transform', `translate(205 150) scale(${k}) translate(-205 -150)`);
  $('#pondClipPath').setAttribute('transform', '');
  // water colour from algae and silt
  let c = mix(css('--water-clear'), css('--water-algae'), Math.min(1, A / 75));
  c = mix(c, css('--water-murky'), Math.min(0.6, sed * 1.2));
  $('#water').style.fill = c;
  $('#silt').setAttribute('opacity', Math.min(0.55, sed * 1.4).toFixed(2));
  // algae mats
  document.querySelectorAll('#algae ellipse').forEach(e => { e.setAttribute('opacity', (+e.dataset.t < A / 85 ? 0.75 : 0)); });
  // shelf and buffer
  $('#shelf').setAttribute('stroke-width', (plants * 22).toFixed(1));
  $('#shelf').setAttribute('opacity', plants > 0.02 ? 1 : 0);
  const buf = app.lastEdge === 'buffer';
  $('#buffer').setAttribute('stroke-width', buf ? 46 : 0);
  $('#buffer').setAttribute('opacity', buf ? 0.9 : 0);
  // flowers along the shelf
  const fl = $('#flowers'); fl.innerHTML = '';
  const path = $('#shelf'), len = path.getTotalLength(), n = Math.round(plants * 22);
  for (let i = 0; i < n; i++) {
    const p = path.getPointAtLength((i / n) * len + 7);
    const o = (i % 2 ? 1 : -1) * plants * 5;
    const cEl = document.createElementNS(NS, 'circle');
    cEl.setAttribute('cx', p.x + o * 0.4); cEl.setAttribute('cy', p.y + o * 0.6); cEl.setAttribute('r', 2.2);
    cEl.setAttribute('fill', 'var(--flower)'); fl.appendChild(cEl);
  }
  // weeds
  const wd = $('#weeds'); wd.innerHTML = '';
  const nw = Math.round(weeds / 10);
  for (let i = 0; i < nw; i++) {
    const p = path.getPointAtLength(((i * 0.137 + 0.05) % 1) * len);
    const g = document.createElementNS(NS, 'path');
    g.setAttribute('d', `M${p.x} ${p.y} l-4 -9 M${p.x} ${p.y} l0 -11 M${p.x} ${p.y} l4 -9`);
    g.setAttribute('stroke', 'var(--marsh)'); g.setAttribute('stroke-width', 2); g.setAttribute('stroke-linecap', 'round');
    wd.appendChild(g);
  }
  // fish
  const fs = $('#fishes'); fs.innerHTML = '';
  const nf = Math.round(fish / 17);
  const spots = [[170, 130], [240, 160], [200, 185], [260, 120], [150, 165], [225, 110]];
  for (let i = 0; i < nf; i++) {
    const [x, y] = spots[i];
    const g = document.createElementNS(NS, 'path');
    g.setAttribute('d', `M${x} ${y} q8 -5 14 0 q-6 5 -14 0 Z M${x} ${y} l-5 -4 v8 Z`);
    g.setAttribute('fill', '#ffffff'); g.setAttribute('opacity', 0.55); g.setAttribute('class', 'fish');
    g.style.animationDelay = (i * 0.9) + 's'; fs.appendChild(g);
  }
  $('#fountain').setAttribute('opacity', d.fountain ? 1 : 0);
  $('#trap').setAttribute('opacity', d.trap ? 1 : 0);
  const trapFull = s && s.trapFill >= 0.6;
  $('#trap').setAttribute('fill', trapFull ? 'var(--warn)' : 'var(--sand)');
  $('#outlet').setAttribute('fill', clog > 0.55 ? 'var(--bad)' : clog > 0.3 ? 'var(--warn)' : 'var(--surface)');
  document.querySelectorAll('#houses g').forEach(g => g.querySelector('.puddle').setAttribute('opacity', app.flooded.has(+g.dataset.i) ? 0.8 : 0));
}

/* ---------- meters & header ---------- */
function meter(label, val, pct, unit, delta) {
  const cls = pct >= 60 ? '' : pct >= 40 ? 'mid' : 'low';
  return `<div class="meter"><span class="lab">${label}</span><span class="val">${val}${unit ? `<small>${unit}</small>` : ''}</span><div class="bar"><span class="${cls}" style="width:${Math.max(3, Math.min(100, pct))}%"></span></div>${delta || '<span class="delta">&nbsp;</span>'}</div>`;
}
function dlt(v, money_) {
  if (v === undefined || Math.abs(v) < (money_ ? 1 : 1)) return '<span class="delta">no change</span>';
  const up = v > 0;
  return `<span class="delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${money_ ? money(Math.abs(v)).replace('−', '') : Math.round(Math.abs(v))}</span>`;
}
function moodWord(m) { return m >= 70 ? 'Pleased' : m >= 55 ? 'Content' : m >= 40 ? 'Grumbling' : 'Upset'; }
function renderMeters() {
  const s = app.state, r = app.phase === 'result' ? app.report : null;
  const A = s ? s.A : 22, fish = s ? s.fish : 70, mood = s ? s.mood : 70;
  const fund = s ? s.cash : POND.BUDGET - POND.designCost(app.design);
  const clarity = 100 - A;
  $('#meters').innerHTML =
    meter('Water clarity', Math.round(clarity), clarity, '/100', r ? dlt(r.before.A - r.after.A) : '') +
    meter('Fish', Math.round(fish), fish, '/100', r ? dlt(r.after.fish - r.before.fish) : '') +
    meter('Neighbors', moodWord(mood), mood, '', r ? dlt(r.after.mood - r.before.mood) : '') +
    meter('Pond fund', money(fund), fund >= 15000 ? 80 : fund >= 6000 ? 50 : fund >= 0 ? 25 : 3, '', r ? dlt(r.after.cash - r.before.cash, true) : '');
}
function renderWhen() {
  const s = app.state;
  if (!s || app.phase === 'intro' || app.phase === 'design') { $('#when').innerHTML = app.phase === 'design' ? 'Design phase · build budget $50,000' : '5 years · 10 seasons'; return; }
  const i = Math.min(app.phase === 'result' ? s.season - 1 : s.season, 9);
  const w = s.weather[i];
  let dots = '';
  for (let k = 0; k < 10; k++) dots += `<i class="${k % 2 === 0 ? 'wet ' : ''}${k < i ? 'done' : k === i ? 'now' : ''}" title="${k % 2 === 0 ? 'Wet' : 'Dry'} season, year ${Math.floor(k / 2) + 1}"></i>`;
  $('#when').innerHTML = app.phase === 'end' ? `Five years complete <span class="dots">${dots.replace(/now/g, 'done')}</span>` : `Year ${w.year} of 5 · ${w.season === 'wet' ? 'Wet season, Jun–Oct' : 'Dry season, Nov–May'} <span class="dots" aria-hidden="true">${dots}</span>`;
}

/* ---------- panels ---------- */
const STAR = f => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3L2.8 9.5l6.4-.8z" fill="${f ? 'var(--accent)' : 'none'}" stroke="${f ? 'var(--accent)' : 'var(--muted)'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const ICON = {
  water: '<svg viewBox="0 0 28 28"><path d="M14 4c4 6 7 9.5 7 13a7 7 0 0 1-14 0c0-3.5 3-7 7-13z" fill="var(--water-clear)"/></svg>',
  people: '<svg viewBox="0 0 28 28"><circle cx="10" cy="10" r="4" fill="var(--accent)"/><circle cx="19" cy="11" r="3.3" fill="var(--accent)" opacity=".6"/><path d="M3 23c1-5 4-7 7-7s6 2 7 7z" fill="var(--accent)"/><path d="M15 23c.6-4 2.4-5.6 4.4-5.6S23.4 19 24.4 23z" fill="var(--accent)" opacity=".6"/></svg>',
  coin: '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="9" fill="none" stroke="var(--warn)" stroke-width="2.2"/><path d="M14 9v10M11.5 11.5h4a1.8 1.8 0 0 1 0 3.5h-3a1.8 1.8 0 0 0 0 3.5h4" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  house: '<svg viewBox="0 0 28 28"><path d="M5 13l9-8 9 8v10H5z" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round"/><path d="M3 23c3-2 5 2 8 0s5 2 8 0 5 2 7 0" fill="none" stroke="var(--water-clear)" stroke-width="2"/></svg>',
  storm: '<svg viewBox="0 0 34 34"><path d="M9 20a6 6 0 0 1 1-12 8 8 0 0 1 15 2 5 5 0 0 1 0 10z" fill="var(--muted)"/><path d="M13 23l-2 6M19 23l-2 6M25 23l-2 6" stroke="var(--water-clear)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  sun: '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="6" fill="var(--warn)"/><g stroke="var(--warn)" stroke-width="2" stroke-linecap="round"><path d="M17 4v4M17 26v4M4 17h4M26 17h4M8 8l3 3M23 23l3 3M8 26l3-3M23 11l3-3"/></g></svg>'
};

function introPanel() {
  return `<span class="eyebrow">Heron Lake HOA · 120 homes · Central Florida</span>
  <h2>You run the pond committee. Keep the pond healthy for five years.</h2>
  <p>Every street, roof and lawn in the neighborhood drains to one stormwater pond. It holds back floodwater and cleans runoff before it flows downstream. First you design it, then you care for it season by season.</p>
  <ul class="goals">
    <li>${ICON.water}<span><b>Clean water.</b> Keep algae down and nutrients from building up.</span></li>
    <li>${ICON.people}<span><b>Happy neighbors.</b> People want a pond that looks good and has fish.</span></li>
    <li>${ICON.coin}<span><b>A healthy pond fund.</b> Neighbors pay $1,500 a season. Don't run out.</span></li>
    <li>${ICON.house}<span><b>No flooded homes.</b> A big storm is coming at some point. Be ready.</span></li>
  </ul>
  <p class="hint">Earn at least two stars on every goal without flooding anyone to unlock Level 2: Pond Manager.</p>
  <div class="code"><label for="seedIn">Weather code</label><input id="seedIn" inputmode="numeric" maxlength="4" value="${app.seed}"><span>Share a code so a whole group plays the same weather.</span></div>
  <div class="btnrow"><button class="btn" id="go">Design your pond</button></div>`;
}

function designPanel() {
  const D = POND.DESIGN, d = app.design, cost = POND.designCost(d), left = POND.BUDGET - cost;
  const grp = (key, title) => `<div class="group"><div class="gh"><b>${title}</b></div><div class="opts">${D[key].map(o =>
    `<button class="opt" data-k="${key}" data-v="${o.id}" aria-pressed="${d[key] === o.id}"><span class="n">${o.name}</span><span class="c">${o.cost ? money(o.cost) : 'Free'}</span><span class="d">${o.note}</span></button>`).join('')}</div></div>`;
  return `<span class="eyebrow">Step 1 of 2 · Design</span>
  <h2>Build your pond</h2>
  <p class="hint">Money you don't spend now goes into the pond fund for upkeep and emergencies.</p>
  ${grp('size', 'Pond size')}${grp('plants', 'Plants along the edge')}${grp('trap', 'Sediment trap at the inlet')}${grp('fountain', 'Fountain')}
  <div class="budget"><div class="row"><span>Build cost</span><span class="${left < 0 ? 'over' : ''}">${money(cost)} of ${money(POND.BUDGET)}</span></div>
  <div class="bar"><span class="${left < 0 ? 'low' : left < 8000 ? 'mid' : ''}" style="width:${Math.min(100, cost / POND.BUDGET * 100)}%"></span></div>
  <div class="row"><span>Starts the pond fund</span><span class="${left < 0 ? 'over' : ''}">${left < 0 ? 'Over budget by ' + money(-left) : money(left)}</span></div></div>
  <div class="btnrow"><button class="btn" id="build" ${left < 0 ? 'disabled' : ''}>Build it and start year 1</button><button class="btn ghost" id="back">Back</button></div>`;
}

function forecast(w) {
  if (w.season === 'wet') {
    if (w.kind === 'hurricane') return { alert: true, ic: ICON.storm, b: 'Forecasters are tracking a hurricane', t: 'Heavy rain likely this summer. Is your outlet clear?' };
    if (w.kind === 'tropical') return { alert: true, ic: ICON.storm, b: 'A tropical storm is possible', t: 'Expect several inches of rain in a couple of days.' };
    return { ic: ICON.storm, b: 'Rainy season', t: 'Afternoon storms most days. Typical total: 26 to 34 inches.' };
  }
  if (w.kind === 'drought') return { alert: true, ic: ICON.sun, b: 'Drier than normal outlook', t: 'Water levels may drop.' };

}
function planPanel() {
  const s = app.state, w = s.weather[s.season], f = forecast(w);
  const cost = app.picks.reduce((t, id) => t + POND.ACTIONS.find(a => a.id === id).cost, 0) + (app.design.fountain ? 500 : 0);
  const cards = POND.ACTIONS.map(a => {
    const off = a.needs === 'trap' && !app.design.trap;
    const on = app.picks.includes(a.id);
    const full = !on && app.picks.length >= 2;
    return `<button class="opt" data-act="${a.id}" aria-pressed="${on}" ${off || full ? 'disabled' : ''}><span class="tag">${a.tag}</span><span class="n">${a.name}</span><span class="c">${a.cost ? money(a.cost) : 'Free'}</span><span class="d">${off ? 'Needs a sediment trap.' : a.text}</span></button>`;
  }).join('');
  return `<span class="eyebrow">Step 2 of 2 · Season ${s.season + 1} of 10</span>
  <h2>Plan the ${w.season === 'wet' ? 'wet' : 'dry'} season</h2>
  <div class="forecast ${f.alert ? 'alert' : ''}"><span class="ic">${f.ic}</span><span><b>${f.b}</b><span>${f.t}</span></span></div>
  <div class="group"><div class="gh"><b>Choose up to 2 actions</b><span class="hint">${app.picks.length}/2 picked</span></div><div class="opts">${cards}</div></div>
  <div class="budget"><div class="row"><span>This season's costs${app.design.fountain ? ' (incl. $500 fountain power)' : ''}</span><span>${money(cost)}</span></div><div class="row"><span>Dues coming in</span><span>${money(POND.DUES)}</span></div></div>
  <div class="btnrow"><button class="btn" id="run">Run the season</button><span class="hint">Doing nothing is allowed. It's free, for now.</span></div>`;
}

function resultPanel() {
  const r = app.report, w = r.w, s = app.state;
  const kindName = { hurricane: 'Hurricane season', tropical: 'Tropical storm', drought: 'Drought', typical: w.season === 'wet' ? 'Typical wet season' : 'Typical dry season' }[w.kind];
  const ev = r.events.map(e => `<div class="event ${['flood', 'fishkill', 'assessment'].includes(e.k) ? 'bad' : ''}">${e.t}</div>`).join('');
  const good = !r.events.some(e => ['flood', 'fishkill', 'assessment'].includes(e.k)) && w.storm ? `<div class="event ok">The pond handled the storm. No homes flooded.</div>` : '';
  const last = s.season >= POND.SEASONS;
  return `<span class="eyebrow">Season ${s.season} of 10 · results</span>
  <h2>${kindName}: <span class="rain">${w.rain} in</span> of rain${w.heat ? ', hot summer' : ''}</h2>
  ${ev || good ? `<div class="events">${ev}${good}</div>` : ''}
  <div class="whybox"><h3>Why did that happen?</h3><ul class="why">${r.why.length ? r.why.map(t => `<li>${t}</li>`).join('') : '<li>A quiet season. The pond settled out runoff as designed.</li>'}</ul></div>
  <p class="hint">You spent ${money(r.spend)} this season and collected ${money(POND.DUES)} in dues.</p>
  <div class="btnrow"><button class="btn" id="next">${last ? 'See your five-year results' : 'Plan the next season'}</button></div>`;
}

function sparkline(hist) {
  const W = 320, H = 92, pl = 30, pr = 8, pt = 10, pb = 22;
  const x = i => pl + i * (W - pl - pr) / (hist.length - 1), y = v => pt + (1 - v / 100) * (H - pt - pb);
  const pts = hist.map((h, i) => `${x(i).toFixed(1)},${y(100 - h.A).toFixed(1)}`).join(' ');
  const grid = [0, 50, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`).join('');
  const yrs = [0, 2, 4, 6, 8].map((i, k) => `<text x="${(x(i) + x(i + 1)) / 2}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">Y${k + 1}</text>`).join('');
  const lastI = hist.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Water clarity over ten seasons">${grid}${yrs}<polygon points="${x(0)},${y(0)} ${pts} ${x(lastI)},${y(0)}" fill="var(--water-clear)" opacity=".15"/><polyline points="${pts}" fill="none" stroke="var(--water-clear)" stroke-width="2"/><circle cx="${x(lastI)}" cy="${y(100 - hist[lastI].A)}" r="3.5" fill="var(--water-clear)"/></svg>`;
}
function endPanel() {
  const s = app.state, sc = POND.score(s);
  const stars = n => `<span class="stars" aria-label="${n} of 3 stars">${[1, 2, 3].map(i => STAR(i <= n)).join('')}</span>`;
  if (sc.unlocked) store.set('pond-l2', '1');
  const missing = [];
  if (!sc.flood) missing.push(`No flooded homes (${s.flooded} flooded). Keep the outlet clear before storm season, or build more storage.`);
  if (sc.wq < 2) missing.push('Two stars for clean water. Cut nutrients at the source: no-mow strips, edge plants, fertilizer outreach.');
  if (sc.looks < 2) missing.push('Two stars for neighbors. Clear water and healthy fish matter more than a perfectly mowed edge.');
  if (sc.cost < 2) missing.push(s.assessments ? 'Two stars for the fund. You ran out of money and billed neighbors. Quick fixes add up.' : 'Two stars for the fund. End with at least $9,000 in the pond fund.');
  return `<span class="eyebrow">Five-year report · weather code ${app.seed}</span>
  <h2>${sc.unlocked ? 'Your pond is thriving.' : 'Your pond made it through five years.'}</h2>
  <div class="scores">
    <div class="score"><span class="s-l"><b>Clean water</b><span>Average clarity ${Math.round(100 - sc.avgA)}/100</span></span>${stars(sc.wq)}</div>
    <div class="score"><span class="s-l"><b>Happy neighbors</b><span>Mostly ${moodWord(sc.avgMood).toLowerCase()}</span></span>${stars(sc.looks)}</div>
    <div class="score"><span class="s-l"><b>Pond fund</b><span>${money(s.cash)} left${s.assessments ? ` · ${s.assessments} special assessment${s.assessments > 1 ? 's' : ''}` : ''}</span></span>${stars(sc.cost)}</div>
    <div class="score"><span class="s-l"><b>Flood protection</b><span>${s.flooded ? s.flooded + ' homes flooded' : 'Every home stayed dry'}</span></span><span class="pass ${sc.flood ? 'y' : 'n'}">${sc.flood ? 'Passed' : 'Failed'}</span></div>
  </div>
  <div><span class="eyebrow">Water clarity, season by season</span>${sparkline(s.history)}</div>
  ${sc.unlocked
    ? `<div class="unlock"><h3>Level 2 unlocked: Pond Manager</h3><p>Real numbers this time. Set pond depth and outlet size, add rain gardens upstream, run a yearly budget, and read rainfall and water-level graphs. Pass the Hurricane Year challenge to reach Level 3: Pond Engineer.</p><div class="btnrow"><button class="btn" disabled>Play Level 2 (in the full game)</button></div></div>`
    : `<div class="unlock locked"><h3>Level 2: Pond Manager is locked</h3><p>To unlock it, you still need:</p><ul>${missing.map(m => `<li>${m}</li>`).join('')}</ul></div>`}
  <div class="btnrow"><button class="btn" id="again">Play again with new weather</button><button class="btn ghost" id="same">Replay code ${app.seed}</button></div>`;
}

/* ---------- flow ---------- */
function render() {
  const P = { intro: introPanel, design: designPanel, plan: planPanel, result: resultPanel, end: endPanel }[app.phase];
  $('#panel').innerHTML = P();
  renderMeters(); renderWhen(); drawScene();
  bind();
}
function bind() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('go', () => { const v = parseInt(($('#seedIn') || {}).value, 10); if (v > 0) app.seed = v; app.phase = 'design'; render(); top(); });
  on('back', () => { app.phase = 'intro'; render(); });
  document.querySelectorAll('.opt[data-k]').forEach(b => b.addEventListener('click', () => { app.design[b.dataset.k] = +b.dataset.v; render(); }));
  on('build', () => { start(); });
  document.querySelectorAll('.opt[data-act]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.act, i = app.picks.indexOf(id);
    if (i >= 0) app.picks.splice(i, 1);
    else {
      if (id === 'mow') app.picks = app.picks.filter(p => p !== 'buffer');
      if (id === 'buffer') app.picks = app.picks.filter(p => p !== 'mow');
      if (app.picks.length < 2) app.picks.push(id);
    }
    render();
  }));
  on('run', runSeason);
  on('next', () => { app.phase = app.state.season >= POND.SEASONS ? 'end' : 'plan'; app.picks = []; render(); top(); });
  on('again', () => { app.seed = 1000 + Math.floor(Math.random() * 9000); restart(); });
  on('same', restart);
}
function top() { if (window.matchMedia('(max-width: 820px)').matches) document.querySelector('.scene').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function start() { app.state = POND.newGame({ ...app.design }, app.seed); app.flooded = new Set(); app.lastEdge = null; app.picks = []; app.phase = 'plan'; render(); }
function restart() { app.phase = 'design'; app.state = null; app.flooded = new Set(); app.lastEdge = null; render(); top(); }
function runSeason() {
  const btn = $('#run'); if (btn) btn.disabled = true;
  const w = app.state.weather[app.state.season];
  const out = POND.runSeason(app.state, app.picks.slice());
  const scene = $('#scene');
  const density = Math.min(1, w.rain / 44);
  document.querySelectorAll('#rain line').forEach(l => { l.style.visibility = +l.dataset.t < density ? 'visible' : 'hidden'; });
  scene.classList.add('raining');
  if (!w.storm) $('#swell').style.transform = 'none';
  setTimeout(() => {
    scene.classList.remove('raining'); $('#swell').style.transform = '';
    if (app.picks.includes('mow')) app.lastEdge = 'mow'; else if (app.picks.includes('buffer')) app.lastEdge = 'buffer'; else app.lastEdge = null;
    app.state = out.state; app.report = out.report;
    if (out.report.homes) { const order = [8, 7, 6, 0, 5, 1, 4, 2, 3]; let n = out.report.homes; for (const i of order) { if (n <= 0) break; if (!app.flooded.has(i)) { app.flooded.add(i); n--; } } }
    app.phase = 'result'; render(); top();
  }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1700);
}

buildStatic();
if (store.get('pond-l2')) $('#lvl').textContent = 'Level 1 · Level 2 unlocked';
render();
})();
</script>
